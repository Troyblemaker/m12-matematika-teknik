<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sineGrad" x1="6" y1="12" x2="58" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#35ff92" />
      <stop offset="50%" stop-color="#2f6bff" />
      <stop offset="100%" stop-color="#35ff92" />
    </linearGradient>
  </defs>
  <!-- Dark Rounded Square Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0c0c0f" stroke="#2c2c35" stroke-width="2.5" />
  <!-- Subtle Oscilloscope Grid Crosshair -->
  <line x1="10" y1="32" x2="54" y2="32" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />
  <line x1="32" y1="10" x2="32" y2="54" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 3" />
  <!-- Smooth Sinusoidal Wave Curve -->
  <path
    d="M 10 32 C 15.5 10, 26.5 10, 32 32 C 37.5 54, 48.5 54, 54 32"
    stroke="url(#sineGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Peak & Trough Accent Dots -->
  <circle cx="21" cy="15.5" r="3" fill="#35ff92" />
  <circle cx="43" cy="48.5" r="3" fill="#2f6bff" />
</svg>
